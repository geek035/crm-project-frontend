<main class="mx-(--crm-page-mx)">
  @let dealObj = deal();
  @let stateObj = state();

  @if (dealObj) {
    <crm-deal-update-dialog
      [model]="dealObj"
      [(visible)]="updateDialogOpened"
      (updated)="handleDealUpdate($event)"
    ></crm-deal-update-dialog>

    <crm-deal-state-update-dialog
      kind="stage"
      [model]="dealObj"
      [(visible)]="stageUpdateDialogOpened"
      (updated)="handleDealStageUpdate($event)"
    ></crm-deal-state-update-dialog>

    <crm-deal-state-update-dialog
      kind="status"
      [model]="dealObj"
      [(visible)]="statusUpdateDialogOpened"
      (updated)="handleDealStatusUpdate($event)"
    ></crm-deal-state-update-dialog>
  }

  <div class="flex flex-wrap justify-between gap-4">
    <h1 class="crm-heading-1 grow self-end">
      <crm-info-block-state [state]="stateObj">
        {{ dealObj?.title || dealObj?.number | infoBlockEmpty: 'Не удалось получить данные' }}
      </crm-info-block-state>
    </h1>

    <nav
      class="border-primary flex w-fit gap-4 rounded-[calc(var(--p-button-border-radius)+var(--deal-card-nav-padding))] border p-(--deal-card-nav-padding) [--deal-card-nav-padding:--spacing(2)]"
      aria-label="Действия со сделкой"
    >
      <p-button
        icon="pi pi-pencil"
        ariaLabel="Редактировать"
        pTooltip="Редактировать"
        tooltipStyleClass="text-sm"
        [rounded]="true"
        [outlined]="true"
        [disabled]="!dealObj"
        (onClick)="openUpdateDialog()"
      ></p-button>

      <p-button
        icon="pi pi-sitemap"
        ariaLabel="Изменить этап"
        pTooltip="Изменить этап"
        tooltipStyleClass="text-sm"
        [rounded]="true"
        [outlined]="true"
        [disabled]="!dealObj"
        (onClick)="openStageUpdateDialog()"
      ></p-button>

      <p-button
        icon="pi pi-flag"
        ariaLabel="Изменить статус"
        pTooltip="Изменить статус"
        tooltipStyleClass="text-sm"
        [rounded]="true"
        [outlined]="true"
        [disabled]="!dealObj"
        (onClick)="openStatusUpdateDialog()"
      ></p-button>
    </nav>
  </div>

  <crm-deal-general-info></crm-deal-general-info>
</main>
