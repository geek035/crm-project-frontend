<main class="mx-(--crm-page-mx)">
  @let dealObj = deal();
  @let stateObj = state();

  <div class="flex flex-wrap justify-between gap-4">
    <h1 class="crm-heading-1 grow self-end">
      <crm-info-block-state [state]="stateObj">
        {{ dealObj?.title || dealObj?.number | infoBlockEmpty: 'Не удалось получить данные' }}
      </crm-info-block-state>
    </h1>

    <nav
      class="border-primary flex w-fit gap-4 rounded-[calc(var(--p-button-border-radius)+var(--deal-card-nav-padding))] border p-(--deal-card-nav-padding) [--deal-card-nav-padding:--spacing(2)]"
      aria-label="Действия со сделкой"
    >
      <p-button
        icon="pi pi-refresh"
        ariaLabel="Обновить"
        pTooltip="Обновить"
        tooltipStyleClass="text-sm"
        [rounded]="true"
        [outlined]="true"
        (onClick)="refreshDeal()"
      ></p-button>
    </nav>
  </div>

  <crm-deal-general-info></crm-deal-general-info>
</main>
