<p-toast [key]="crmToastKey"></p-toast>

@if (confirmationRequest(); as request) {
  <crm-confirmation-dialog
    [header]="request.header"
    [label]="request.label"
    [visible]="true"
    (confirmed)="handleConfirmation($event)"
  ></crm-confirmation-dialog>
}

<div class="grid flex-1 grid-cols-1 grid-rows-[auto_1fr_auto]">
  <crm-header class="z-10 mb-8"></crm-header>
  <router-outlet></router-outlet>
</div>
